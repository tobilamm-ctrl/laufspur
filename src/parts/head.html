<title>Spurwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: schräges Bahnrot-Band oben, darunter Werkbank (Steuerung links, Poster auf der Bahn rechts) */
:root{
  --bg:#ECEEF6; --panel:#FFFFFF; --ink:#17133B; --muted:#5C5880; --line:#D5D6E7; --chip:#F2F3FA;
  --tartan:#E3432A; --tartan-deep:#B8301C; --cobalt:#2B45E3; --sun:#FFC233;
  --stage:#DADDED; --lane:rgba(23,19,59,.08);
  --shadow:0 34px 60px -24px rgba(16,12,60,.55);
  --f-display:'Anybody','Arial Narrow',Impact,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Chivo Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100E25; --panel:#1A1737; --ink:#F0EEFF; --muted:#A39FCB; --line:#2F2B58; --chip:#221F45;
  --tartan:#F2543A; --tartan-deep:#C93A22; --cobalt:#7184FF; --sun:#FFC94D;
  --stage:#0A0919; --lane:rgba(255,255,255,.05); --shadow:0 34px 70px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100E25; --panel:#1A1737; --ink:#F0EEFF; --muted:#A39FCB; --line:#2F2B58; --chip:#221F45;
  --tartan:#F2543A; --tartan-deep:#C93A22; --cobalt:#7184FF; --sun:#FFC94D;
  --stage:#0A0919; --lane:rgba(255,255,255,.05); --shadow:0 34px 70px -20px rgba(0,0,0,.8); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ---------- Kopfband ---------- */
.mast{position:relative;background:var(--tartan);color:#fff;
  background-image:repeating-linear-gradient(104deg,transparent 0 54px,rgba(255,255,255,.2) 54px 57px);
  clip-path:polygon(0 0,100% 0,100% 72%,0 100%);
  padding-block:18px 34px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast-in{max-width:1500px;margin-inline:auto;display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-style:italic;font-stretch:150%;
  font-size:clamp(28px,4.2vw,46px);line-height:1;letter-spacing:-.01em;margin:0}
.speed{display:grid;gap:5px;justify-items:end}
.speed i{display:block;height:5px;background:#fff;transform:skewX(-20deg)}
.speed i:nth-child(1){width:30px}.speed i:nth-child(2){width:20px;opacity:.75}.speed i:nth-child(3){width:11px;opacity:.5}
.tag{margin:0;font-weight:600;font-size:16px;opacity:.95}
.run{margin-left:auto;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(0,0,0,.18);padding:7px 12px;transform:skewX(-12deg)}
.run span{display:inline-block;transform:skewX(12deg)}

/* ---------- Werkbank ---------- */
.studio{max-width:1500px;margin:-6px auto 0;display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:22px;align-items:start;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:14px;align-self:start;min-width:0}
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:15px 20px;flex-wrap:wrap}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s ease}
.sec[open] > summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.sec > summary:hover h2{color:var(--tartan)}
.sum{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.sec[open] .sum{display:none}
.sec-body{display:grid;gap:12px;padding:0 20px 18px}
.sec h2{margin:0;transition:color .15s ease;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-style:italic;
  font-stretch:125%;font-size:20px;line-height:1.1;text-wrap:balance}
.lane-no{display:inline-block;font-family:var(--f-mono);font-style:normal;font-stretch:100%;font-weight:700;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--tartan);padding:4px 10px;transform:skewX(-14deg)}
.lane-no b{display:inline-block;transform:skewX(14deg);font-weight:700}
.hint{margin:0;color:var(--muted);font-size:13.5px}
.mapstatus{padding:9px 11px;border-radius:8px;background:var(--chip);border-left:4px solid var(--cobalt)}
.mapstatus[data-state="error"]{border-left-color:var(--tartan)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--cobalt);font-weight:700;text-decoration:underline;cursor:pointer}

.drop{display:grid;gap:8px;justify-items:start;padding:14px;border:2px dashed var(--line);border-radius:10px;background:var(--chip)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-line{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.file-line strong{color:var(--ink);font-weight:700}

.btn{appearance:none;border:0;cursor:pointer;display:inline-block;padding:11px 20px;transform:skewX(-12deg);
  font-family:var(--f-display);font-weight:800;font-style:italic;font-stretch:125%;font-size:15px;letter-spacing:.02em;text-transform:uppercase;
  transition:transform .15s ease,background-color .15s ease}
.btn > span{display:inline-block;transform:skewX(12deg)}
.btn-primary{background:var(--tartan);color:#fff}
.btn-primary:hover{background:var(--tartan-deep)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--panel)}
.btn-small{padding:8px 14px;font-size:13px}
.btn:active{transform:skewX(-12deg) translateX(3px)}
.btn[disabled]{opacity:.5;cursor:progress}

.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tpl{appearance:none;border:2px solid var(--line);background:var(--chip);border-radius:10px;padding:8px;cursor:pointer;
  display:grid;gap:7px;text-align:left;transition:border-color .15s ease,transform .15s ease}
.tpl:hover{transform:translateY(-2px)}
.tpl[aria-pressed="true"]{border-color:var(--tartan);background:var(--panel)}
.thumb{display:block;border-radius:4px;overflow:hidden;box-shadow:0 8px 16px -10px rgba(10,8,40,.6)}
.thumb svg{display:block;width:100%;height:auto}
.tpl-name{font-family:var(--f-display);font-weight:800;font-style:italic;font-stretch:125%;font-size:15px;line-height:1.1}
.tpl-blurb{font-size:12px;color:var(--muted);line-height:1.3}

.field{display:grid;gap:5px}
.field label:not(.chip),.sub-h{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input[type=text]{width:100%;background:var(--chip);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px}
.field input[type=text]:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 25%,transparent)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:7px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;font-weight:600;
  background:var(--panel);transition:background-color .12s ease,color .12s ease,border-color .12s ease}
.chip input:checked + span{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chip input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.chip input:disabled + span{opacity:.4;cursor:not-allowed}
.chip input:disabled{cursor:not-allowed}

.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--tartan);min-width:0}
.range-val{font-family:var(--f-mono);font-weight:700;font-size:14px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Bühne ---------- */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0;background:var(--stage);border-radius:14px;padding:18px clamp(14px,3vw,40px) 26px;
  background-image:repeating-linear-gradient(0deg,transparent 0 70px,var(--lane) 70px 73px);display:grid;gap:16px;align-content:start}
.stage.drag{outline:3px dashed var(--tartan);outline-offset:-10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.now{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.now b{color:var(--ink)}
.export{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.poster{--ratio:1.414;width:min(100%,calc((100vh - 190px) / var(--ratio)));min-width:min(100%,300px);margin-inline:auto;box-shadow:var(--shadow);line-height:0}
.poster svg{display:block;width:100%;height:auto}
.poster.swap{animation:swap .5s cubic-bezier(.2,.85,.25,1)}
@keyframes swap{from{transform:translateX(-22px) skewX(5deg);opacity:.35}to{transform:none;opacity:1}}
.foot{margin:0;text-align:center;color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;max-width:calc(100% - 32px);z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}

.select{background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;max-width:100%}
.field-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field input[aria-invalid="true"]{border-color:var(--tartan)}
.colors{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.color-field{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.color-field input{width:38px;height:30px;padding:0;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.marks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.marks li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.marks input{width:100%;background:var(--chip);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px}
.mark-km{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px}
.photo-row,.btn-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.photo-row input,.btn-row input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.grid-gap{display:grid;gap:12px}
.chip span{line-height:1.3}
.btn-ghost[aria-pressed="true"]{background:var(--tartan);color:#fff;box-shadow:none}
.poster.marking{cursor:crosshair;outline:3px dashed var(--tartan);outline-offset:6px}
@media (max-width:480px){.field-row{grid-template-columns:minmax(0,1fr)}}
#rundel{justify-self:start}
.foot-links{display:inline-flex;gap:14px;margin-left:10px}
.foot-links a{color:var(--cobalt);font-weight:700}
.legal{width:min(720px,calc(100% - 32px));max-height:calc(100% - 48px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.legal::backdrop{background:rgba(10,8,30,.55)}
.legal-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.legal-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-stretch:125%;font-size:22px}
.legal-body{padding:6px 22px 22px;line-height:1.55;max-width:68ch}
.legal-body h3{font-size:15px;margin:20px 0 6px}
.legal-body p,.legal-body ul{margin:0 0 10px}
.legal-body .todo{background:color-mix(in srgb,var(--sun) 45%,transparent);padding:0 4px;border-radius:3px;font-weight:700}
#measure{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden}

@media (max-width:900px){
  .studio{grid-template-columns:minmax(0,1fr)}
  .stage{order:-1;position:relative;top:auto}
  .poster{width:min(100%,calc((100vh - 120px) / var(--ratio)))}
  .run{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .poster.swap{animation:none}
  .btn,.tpl,.chip span,.sec > summary::after{transition:none}
}
</style>
